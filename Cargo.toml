[package]
name = "pgxn_build"
version = "0.1.0"
description = "Build PGXN distributions"
repository = "https://github.com/pgxn/build"
documentation = "https://docs.rs/pgxn_build/"
authors = ["David E. Wheeler <david@justatheory.com>"]
readme = "README.md"
keywords = ["pgxn", "postgres", "postgresql", "extension", "validation"]
license = "PostgreSQL"
categories = ["web-programming", "database"]
edition = "2024"
exclude = [ ".github", ".vscode", ".gitignore", ".ci", ".pre-*.yaml"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
cargo_toml = "0.22.3"
chrono = "0.4.43"
hex = "0.4.3"
iri-string = "0.7.10"
log = { version = "0.4.29", features = ["kv"] }
owo-colors = "4.2.3"
pgxn_meta = "0.7.0"
regex = "1.12.3"
semver = "1.0.27"
serde = "1.0.228"
serde_json = "1.0.149"
supports-color = "3.0.2"
tempfile = "3.24.0"
thiserror = "2.0.18"
ureq = { version = "3.1.4", features = ["json"] }
url = "2.5.8"
zip = "7.3.0"

[dev-dependencies]
httpmock = "0.8.3"
sha2 = "0.10.9"
temp-env = "0.3.6"
assertables = "9.8.4"
